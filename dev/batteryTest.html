<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/png" href="/favicon.png">

	<title>Battery Icon Test</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #f2efe9;
		}
		#game-container {
			width: 100%;
			height: 100%;
		}
		canvas {
			display: block;
		}
	</style>
</head>
<body>
	<div id="game-container"></div>
	<script src="../phaser.min.js"></script>
	<script src="../batteryChargeData.js"></script>
	<script src="BatteryTestScene.js"></script>
	<script>
		const testConfig = {
			type: Phaser.AUTO,
			parent: 'game-container',
			backgroundColor: '#f2efe9',
			scene: [BatteryTestScene],
			scale: {
				mode: Phaser.Scale.FIT,
				autoCenter: Phaser.Scale.CENTER_BOTH,
				width: 720,
				height: 1280,
				resolution: window.devicePixelRatio || 1,
			},
			render: {
				antialias: true,
				pixelArt: false,
			},
		};

		document.addEventListener('DOMContentLoaded', () => {
			new Phaser.Game(testConfig);
		});
	</script>
</body>
</html>
